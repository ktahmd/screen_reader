name: screen_reader
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies: 
  flutter:
    sdk: flutter

  # overlay window and permission handler
  flutter_overlay_window: ^0.5.0
  permission_handler: ^12.0.1

  # text to speech
  flutter_tts: ^4.2.5
  audioplayers: ^6.6.0

  # text recognition OCR
  google_mlkit_text_recognition: ^0.15.0

  # google translator
  translator: ^1.0.4+1

  # others
  provider: ^6.1.5+1
  circle_flags: ^5.0.1
  path_provider: ^2.1.5
  http: ^1.6.0
  fluttertoast: ^8.2.4
  crypto: ^3.0.7

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
